name: Apply authored examples
on:
  push:
    paths:
      - 'scripts/patch_next_100.js'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch_next_100.js
      - run: |
          node - <<'JS'
          const d=require('./content/en/dictionary.json');
          const bad=d.words.filter(w=>!Array.isArray(w.examples)||w.examples.length!==3);
          console.log('complete='+ (d.words.length-bad.length) +'/'+d.words.length+' missing='+bad.length);
          JS
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en/dictionary.json
          git commit -m "Apply 100 authored example sets"
          git push

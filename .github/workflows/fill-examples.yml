name: Fill dictionary examples
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fill_examples.py'
      - '.github/workflows/fill-examples.yml'
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill examples
        run: python scripts/fill_examples.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('content/en/dictionary.json',encoding='utf-8'))
          good=sum(len(w.get('examples',[]))==3 for w in d['words'])
          print(f'{good}/{len(d["words"])} words have 3 examples')
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en/dictionary.json content/en/missing_examples.json
          if ! git diff --cached --quiet; then
            git commit -m "Fill dictionary with real-life examples"
            git push origin HEAD:main
          fi

# rerun latest main

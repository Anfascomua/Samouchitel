<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Обновление Самоучителя</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#eef2ff;font:600 18px system-ui,sans-serif;text-align:center}.box{max-width:310px;padding:28px}.spin{width:36px;height:36px;margin:0 auto 18px;border:4px solid #31558d;border-top-color:#5b9cff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{display:block;color:#aeb9cc;margin-top:10px;font-weight:400}</style>
<main class="box"><div class="spin"></div><div>Обновляю Самоучитель…</div><small>Старая офлайн-копия будет заменена актуальной.</small></main>
<script>
(async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}finally{location.replace('./?repaired='+Date.now())}})();
</script>
</html>
